# Compile, unit-test and lint on every push. This job does not distribute APKs:
# installable builds come from EAS Build.
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the code. No secrets are used, so
# pull requests from forks can run it safely.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # Refuse to build if gradle-wrapper.jar isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      # Separate step: checks R8 shrinking still works (and lint has crashed when run together with it).
      - name: Minified release build
        run: ./gradlew assembleRelease --console=plain
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
