// App module. Kept in Groovy because EAS Build injects its signing config
// by adding `apply from: "./eas-build.gradle"` to this file.
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace "com.flowveo.prompter"
    compileSdk 37

    defaultConfig {
        applicationId "com.flowveo.prompter"
        minSdk 31
        targetSdk 35
        versionCode 7
        versionName "0.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    ksp {
        // Room schema export for future migrations.
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    buildTypes {
        release {
            // R8 removes the unused parts of the Anthropic SDK and other libraries.
            // The SDK ships its own keep rules for Jackson / Kotlin reflection.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Local test builds use the same debug key as earlier builds, so they install over
            // them. EAS replaces this with its own keystore (eas-build.gradle, applied later).
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            // GraalVM native-image metadata (3.6 MB in the SDK) and duplicate licence files: unused on Android.
            excludes += ["META-INF/native-image/**", "META-INF/AL2.0", "META-INF/LGPL2.1", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        // Lint warnings are reported but only errors fail the build.
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.savedstate.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.kotlinx.coroutines.android
    implementation libs.anthropic.java
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.org.json
}
